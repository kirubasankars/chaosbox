openapi: 3.0.3
info:
  title: chaosbox
  description: >
    Small HTTP service used for infra demos and testing: health/version,
    file cat, a counter (in-memory or Redis), CPU/memory/disk load
    simulators, peer membership tracking, and Prometheus metrics. Load
    actions fan out (single hop, best-effort) to known peers.
  version: "0.1.0"
servers:
  - url: /
tags:
  - name: health
  - name: cat
  - name: counter
  - name: load
  - name: logs
  - name: metrics
  - name: ui
# Optional; only enforced when auth_token is set in config.json.
security:
  - BearerAuth: []
  - TokenHeader: []
  - TokenQuery: []
paths:
  /:
    get:
      tags: [health]
      summary: Health, version, and running load simulators
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /_cat/file:
    get:
      tags: [cat]
      summary: Contents of the file passed via -file
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: file could not be read
  /_cat/nodes:
    get:
      tags: [cat]
      summary: Membership table (self + peers), including per-node load state
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: |
                  ip              version  status  self  load
                  127.0.0.1:8080  0.1.0    up      *     -
  /count:
    get:
      tags: [counter]
      summary: Current counter value (in-memory or Redis)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "500":
          description: backend error (e.g. Redis unreachable)
  /count/incr:
    post:
      tags: [counter]
      summary: Increment the shared counter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "500":
          description: backend error (e.g. Redis unreachable)
  /count/decr:
    post:
      tags: [counter]
      summary: Decrement the shared counter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "500":
          description: backend error (e.g. Redis unreachable)
  /log/error:
    post:
      tags: [logs]
      summary: Emit a deliberate error-level log and return 500 (Observe / OTEL feature test)
      responses:
        "500":
          description: Error log emitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  msg:
                    type: string
                    example: log.error_emitted
        "405":
          description: Method not allowed
  /load/cpu/start:
    post:
      tags: [load]
      summary: Start a pulsing CPU load (also triggers this on known peers)
      parameters:
        - $ref: "#/components/parameters/MinPct"
        - $ref: "#/components/parameters/MaxPct"
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: started }
                  kind: { type: string, example: cpu }
                  min_pct: { type: number }
                  max_pct: { type: number }
                  period: { type: integer, description: seconds }
  /load/cpu/stop:
    post:
      tags: [load]
      summary: Stop the CPU load (also triggers this on known peers)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadStopped"
  /load/mem/start:
    post:
      tags: [load]
      summary: Start a pulsing memory load (also triggers this on known peers)
      parameters:
        - $ref: "#/components/parameters/MemMB"
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: started }
                  kind: { type: string, example: mem }
                  mb: { type: integer, description: peak MB held }
                  period: { type: integer, description: seconds }
        "500":
          description: could not determine available memory
  /load/mem/stop:
    post:
      tags: [load]
      summary: Stop the memory load (also triggers this on known peers)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadStopped"
  /load/disk/start:
    post:
      tags: [load]
      summary: Start a pulsing disk IO load (also triggers this on known peers)
      parameters:
        - $ref: "#/components/parameters/DiskMB"
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: started }
                  kind: { type: string, example: disk }
                  data: { type: string, description: data directory }
                  file: { type: string, description: load file path }
                  mb: { type: integer }
                  period: { type: integer, description: seconds }
        "500":
          description: disk IO setup failed
  /load/disk/stop:
    post:
      tags: [load]
      summary: Stop the disk IO load (also triggers this on known peers)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadStopped"
  /load/all/start:
    post:
      tags: [load]
      summary: Start CPU, memory, and disk load together (also triggers this on known peers)
      parameters:
        - $ref: "#/components/parameters/MinPct"
        - $ref: "#/components/parameters/MaxPct"
        - name: mb
          in: query
          description: memory + disk MB (defaults to 60% available memory / 64MB disk)
          schema: { type: integer }
        - $ref: "#/components/parameters/Period"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: started }
                  kind: { type: string, example: all }
                  min_pct: { type: number }
                  max_pct: { type: number }
                  mem_mb: { type: integer }
                  disk_mb: { type: integer }
                  data: { type: string }
                  file: { type: string }
                  period: { type: integer, description: seconds }
        "500":
          description: load setup failed
  /load/all/stop:
    post:
      tags: [load]
      summary: Stop all load simulators (also triggers this on known peers)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadStopped"
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus exposition
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /ui:
    get:
      tags: [ui]
      summary: Single-page control console for status and API actions
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /ui/nodes:
    get:
      tags: [ui]
      summary: Membership snapshot as JSON (used by the control console)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ip: { type: string }
                    version: { type: string }
                    status: { type: string }
                    self: { type: boolean }
                    load:
                      type: object
                      additionalProperties: { type: boolean }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Optional shared token, enabled when auth_token is set in config.json.
        Present it as "Authorization: Bearer <token>", the X-Auth-Token header,
        or a ?token= query parameter. Failed auth returns 401 and is logged.
    TokenHeader:
      type: apiKey
      in: header
      name: X-Auth-Token
    TokenQuery:
      type: apiKey
      in: query
      name: token
  parameters:
    MinPct:
      name: min_pct
      in: query
      description: minimum CPU percent (default 60)
      schema: { type: number }
    MaxPct:
      name: max_pct
      in: query
      description: maximum CPU percent (default 80)
      schema: { type: number }
    MemMB:
      name: mb
      in: query
      description: peak memory MB (default 60% of available memory)
      schema: { type: integer }
    DiskMB:
      name: mb
      in: query
      description: disk load file size in MB (default 64)
      schema: { type: integer }
    Period:
      name: period
      in: query
      description: pulse period in seconds (default 10)
      schema: { type: integer }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: "0.1.0" }
        load:
          type: object
          properties:
            cpu: { type: boolean }
            memory: { type: boolean }
            disk: { type: boolean }
    Count:
      type: object
      properties:
        count: { type: integer, format: int64 }
    LoadStopped:
      type: object
      properties:
        status: { type: string, example: stopped }
        kind: { type: string, example: cpu }
